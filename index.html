<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flames</title>
</head>

<body>
    <div class="box">
        <h1>Flames</h1>
        <p>Enter Two Names</p>
        <input type="text" id="name1" placeholder="Your Name .........">
        <input type="text" id="name2" placeholder="Your Crush Name ...">
        <button id="CalculateButton" onclick="calculateFlames()">
            Calculate
        </button>
        <button onclick="resetGame()">
            Reset
        </button>
        <div id="resultBox">
            <p>Result:</p>
            <div id="result"></div>
        </div>
    </div>

    <div class="wall">
        <h2>Flames Wall</h2>
        <p>
            Names that already saw their Flames
        </p>
        <div class="wall-names" id="wallNames">
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
